# =============================================================================
# Grant Platform – E2E Test Environment
# =============================================================================
# Runs the real API image (same Dockerfile as deployment) plus Postgres and Redis.
# Tests run on the host (Vitest + supertest) and hit the API over HTTP.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml --env-file .env.test up -d --build
#   pnpm test:e2e
#   docker compose -f docker-compose.e2e.yml --env-file .env.test down -v
#
# Adapter integration suites only (no API image build):
#   docker compose -f docker-compose.e2e.yml --env-file .env.test -p grant-e2e \
#     up -d redis localstack
#   pnpm test:integration
#
# Interpolation (${VAR}) uses --env-file .env.test; copy from .env.test.example.
# Defaults below allow the stack to run even if .env.test is missing or outdated.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: grant-e2e-postgres
    command:
      - postgres
      - -c
      - idle_in_transaction_session_timeout=300000
      - -c
      - lock_timeout=30000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grant_e2e}
      POSTGRES_USER: ${POSTGRES_USER:-grant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grant_password}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-grant_user} -d ${POSTGRES_DB:-grant_e2e}']
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-network

  redis:
    image: redis:7-alpine
    container_name: grant-e2e-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-grant_redis_password}
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-grant_redis_password}', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - e2e-network

  # Local AWS emulation for the adapter integration suites (@grantjs/cache,
  # @grantjs/jobs). Only the services those adapters use are enabled, so the e2e
  # stack does not get slower for everyone else. Extend SERVICES as adapters arrive.
  localstack:
    image: localstack/localstack:3.8
    container_name: grant-e2e-localstack
    ports:
      - '4567:4566'
    environment:
      SERVICES: dynamodb,sqs,events
      DEBUG: '0'
      PERSISTENCE: '0'
    # Every service must be up, not just dynamodb: a suite that starts while SQS
    # is still coming up fails intermittently and is miserable to diagnose.
    #
    # Both states count. LocalStack reports a service as "available" until
    # something uses it, then "running" — so matching only "available" makes the
    # container go unhealthy as a *result* of the tests passing.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          h=$$(curl -sf http://localhost:4566/_localstack/health) &&
          echo "$$h" | grep -qE '"dynamodb": "(available|running)"' &&
          echo "$$h" | grep -qE '"sqs": "(available|running)"' &&
          echo "$$h" | grep -qE '"events": "(available|running)"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - e2e-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: grant-e2e-api
    env_file:
      - .env.test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: test
      API_PORT: 4000
      # Host port is 4001 (see ports) to avoid conflict with demo on 4000; APP_URL for JWT iss/aud
      APP_URL: http://localhost:4001

      # Database – from .env.test via interpolation (defaults for E2E)
      DB_URL: postgresql://${POSTGRES_USER:-grant_user}:${POSTGRES_PASSWORD:-grant_password}@postgres:5432/${POSTGRES_DB:-grant_e2e}
      DB_POOL_MAX: 5
      DB_LOG_QUERIES: 'false'

      # Redis – from .env.test via interpolation
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-grant_redis_password}

      # Cache
      CACHE_STRATEGY: redis

      # JWT
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: 30

      # Auth
      AUTH_VERIFICATION_EXPIRATION_HOURS: 24
      AUTH_OTP_VALIDITY_MINUTES: 30

      # MFA (required for TOTP encrypt-at-rest; test-only key — not for production)
      AUTH_MFA_SECRET_ENCRYPTION_KEY: e2e-grant-mfa-secret-key-min-32-chars-long
      AUTH_MFA_TOTP_ISSUER: Grant-E2E

      # Email – console adapter (logs to stdout, no real emails)
      EMAIL_PROVIDER: console
      EMAIL_FROM_ADDRESS: noreply@e2e.grant.dev
      EMAIL_FROM_NAME: Grant E2E

      # Rate limiting – disabled for E2E to avoid 429s
      SECURITY_ENABLE_RATE_LIMIT: 'false'

      # CORS – allow test runner
      SECURITY_CORS_ORIGIN: '*'

      # Frontend URL (used for email links, etc.)
      SECURITY_FRONTEND_URL: http://localhost:3000

      # Swagger – disabled in E2E
      SWAGGER_ENABLED: 'false'

      # Apollo
      APOLLO_INTROSPECTION: 'true'

      # Storage
      STORAGE_PROVIDER: local

      # Logging
      LOG_LEVEL: info

      # Metrics – enabled for E2E so GET /metrics is asserted
      METRICS_ENABLED: 'true'
      METRICS_COLLECT_DEFAULTS: 'false'

      # Telemetry / Analytics / Tracing – noop/disabled in E2E (covered by integration tests)
      TELEMETRY_PROVIDER: none
      ANALYTICS_ENABLED: 'false'
      TRACING_ENABLED: 'false'

      # Job scheduling – node-cron runs workers inline on enqueue (sync job E2E)
      JOBS_ENABLED: 'true'
      JOB_PROVIDER: node-cron
    ports:
      - '4001:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge

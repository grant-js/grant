query GetRoleRelationsPreview(
  $scope: Scope!
  $id: ID!
  $withGroups: Boolean!
  $withTags: Boolean!
  $withUsers: Boolean! = false
  $page: Int = 1
  $limit: Int = 10
) {
  roles(scope: $scope, ids: [$id], limit: 1) {
    roles {
      id
      groups @include(if: $withGroups) {
        id
        name
      }
      tags @include(if: $withTags) {
        id
        name
        color
      }
      users(page: $page, limit: $limit) @include(if: $withUsers) {
        id
        name
        authenticationMethods {
          provider
          providerId
        }
      }
      userCount @include(if: $withUsers)
    }
  }
}

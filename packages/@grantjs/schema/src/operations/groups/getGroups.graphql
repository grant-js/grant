query GetGroups(
  $scope: Scope!
  $page: Int
  $limit: Int
  $sort: GroupSortInput
  $search: String
  $ids: [ID!]
  $tagIds: [ID!]
) {
  groups(
    scope: $scope
    page: $page
    limit: $limit
    sort: $sort
    search: $search
    ids: $ids
    tagIds: $tagIds
  ) {
    groups {
      id
      name
      description
      metadata
      createdAt
      updatedAt
      # IDs only — enough for inheritance maps; avoid nested permission.tags (N+1).
      permissions {
        id
      }
      tags {
        id
        name
        color
        isPrimary
      }
    }
    totalCount
    hasNextPage
  }
}

query GetGroupRelationsPreview(
  $scope: Scope!
  $id: ID!
  $withPermissions: Boolean!
  $withTags: Boolean!
  $withUsers: Boolean! = false
  $page: Int = 1
  $limit: Int = 10
) {
  groups(scope: $scope, ids: [$id], limit: 1) {
    groups {
      id
      permissions @include(if: $withPermissions) {
        id
        name
      }
      tags @include(if: $withTags) {
        id
        name
        color
      }
      users(page: $page, limit: $limit) @include(if: $withUsers) {
        id
        name
        authenticationMethods {
          provider
          providerId
        }
      }
      userCount @include(if: $withUsers)
    }
  }
}

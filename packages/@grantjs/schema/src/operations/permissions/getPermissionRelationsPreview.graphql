query GetPermissionRelationsPreview(
  $scope: Scope!
  $id: ID!
  $withTags: Boolean! = true
  $withGroups: Boolean! = false
  $withUsers: Boolean! = false
  $page: Int = 1
  $limit: Int = 10
) {
  permissions(scope: $scope, ids: [$id], limit: 1) {
    permissions {
      id
      tags @include(if: $withTags) {
        id
        name
        color
      }
      groups(page: $page, limit: $limit) @include(if: $withGroups) {
        id
        name
      }
      groupCount @include(if: $withGroups)
      users(page: $page, limit: $limit) @include(if: $withUsers) {
        id
        name
      }
      userCount @include(if: $withUsers)
    }
  }
}

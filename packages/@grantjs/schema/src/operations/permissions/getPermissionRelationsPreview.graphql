query GetPermissionRelationsPreview(
  $scope: Scope!
  $id: ID!
  $withTags: Boolean! = true
  $withGroups: Boolean! = false
  $withUsers: Boolean! = false
) {
  permissions(scope: $scope, ids: [$id], limit: 1) {
    permissions {
      id
      tags @include(if: $withTags) {
        id
        name
        color
      }
      groups(limit: 10) @include(if: $withGroups) {
        id
        name
      }
      users(limit: 10) @include(if: $withUsers) {
        id
        name
      }
    }
  }
}

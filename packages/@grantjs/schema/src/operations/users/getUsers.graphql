query GetUsers(
  $scope: Scope!
  $page: Int
  $limit: Int
  $sort: UserSortInput
  $search: String
  $ids: [ID!]
  $tagIds: [ID!]
) {
  users(
    scope: $scope
    page: $page
    limit: $limit
    sort: $sort
    search: $search
    ids: $ids
    tagIds: $tagIds
  ) {
    users {
      id
      name
      pictureUrl
      metadata
      createdAt
      updatedAt
      roles {
        id
        name
        tags {
          id
          name
          color
          isPrimary
        }
      }
      userGroups {
        id
        groupId
        group(scope: $scope) {
          id
          name
          tags {
            id
            name
            color
            isPrimary
          }
        }
      }
      userPermissions {
        id
        permissionId
        permission(scope: $scope) {
          id
          name
          action
          resource {
            slug
          }
        }
      }
      tags {
        id
        name
        color
        isPrimary
      }
      authenticationMethods {
        provider
        providerId
      }
    }
    totalCount
    hasNextPage
  }
}

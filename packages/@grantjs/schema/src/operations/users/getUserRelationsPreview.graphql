query GetUserRelationsPreview(
  $scope: Scope!
  $id: ID!
  $withRoles: Boolean!
  $withTags: Boolean!
  $withGroups: Boolean! = false
  $withPermissions: Boolean! = false
  $page: Int = 1
  $limit: Int = 10
) {
  users(scope: $scope, ids: [$id], limit: 1) {
    users {
      id
      roles @include(if: $withRoles) {
        id
        name
      }
      tags @include(if: $withTags) {
        id
        name
        color
      }
      groups(page: $page, limit: $limit) @include(if: $withGroups) {
        id
        name
      }
      groupCount @include(if: $withGroups)
      permissions(page: $page, limit: $limit) @include(if: $withPermissions) {
        id
        name
      }
      permissionCount @include(if: $withPermissions)
    }
  }
}

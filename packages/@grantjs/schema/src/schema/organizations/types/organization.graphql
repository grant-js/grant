type Organization implements Auditable {
  id: ID!
  name: String!
  slug: String!
  pictureUrl: String
  requireMfaForSensitiveActions: Boolean!
  projects: [Project!]
  roles: [Role!]
  groups: [Group!]
  permissions: [Permission!]
  users: [User!]
  tags: [Tag!]
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date
}

type Role implements Auditable {
  id: ID!
  name: String!
  description: String
  metadata: JSON!
  groups: [Group!]
  rolePermissions: [RolePermission!]
  tags: [Tag!]
  primaryTag: Tag
  groupCount: Int!
  permissionCount: Int!
  tagCount: Int!
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date
}

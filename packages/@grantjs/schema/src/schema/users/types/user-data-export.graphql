type UserDataExport {
  user: UserExportData!
  accounts: [AccountExportData!]!
  authenticationMethods: [AuthenticationMethodExportData!]!
  credentials: [CredentialExportData!]!
  sessions: [SessionExportData!]!
  organizationMemberships: [OrganizationMembershipExportData!]!
  projectMemberships: [ProjectMembershipExportData!]!
  exportedAt: Date!
}

type UserExportData {
  id: ID!
  name: String!
  email: String
  createdAt: Date!
  updatedAt: Date!
}

type AccountExportData {
  id: ID!
  type: AccountType!
  createdAt: Date!
  updatedAt: Date!
}

type AuthenticationMethodExportData {
  provider: String!
  providerId: String!
  isVerified: Boolean!
  isPrimary: Boolean!
  lastUsedAt: Date
  createdAt: Date!
}

"""
A password credential the user holds, per scope. Existence, scope, source and dates only:
the hash is never exported.
"""
type CredentialExportData {
  "platform (the Grant console) or project (that project's apps)"
  scope: String!
  "Set for a project credential"
  projectId: ID
  source: String!
  lastUsedAt: Date
  createdAt: Date!
  updatedAt: Date!
}

type SessionExportData {
  userAgent: String
  ipAddress: String
  lastUsedAt: Date
  expiresAt: Date!
  createdAt: Date!
}

type OrganizationMembershipExportData {
  organizationId: ID!
  organizationName: String!
  role: String!
  joinedAt: Date!
}

type ProjectMembershipExportData {
  projectId: ID!
  projectName: String!
  role: String!
  joinedAt: Date!
}

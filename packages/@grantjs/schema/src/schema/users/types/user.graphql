type User implements Auditable {
  id: ID!
  name: String!
  pictureUrl: String
  metadata: JSON!
  roles: [Role!]
  userGroups: [UserGroup!]
  userPermissions: [UserPermission!]
  tags: [Tag!]
  primaryTag: Tag
  roleCount: Int!
  permissionCount: Int!
  projectUserApiKeyCount: Int!
  tagCount: Int!
  authenticationMethods: [UserAuthenticationMethod!]
  accounts: [Account!]
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date
}

type User implements Auditable {
  id: ID!
  name: String!
  pictureUrl: String
  metadata: JSON!
  roles: [Role!]
  userGroups: [UserGroup!]
  userPermissions: [UserPermission!]
  tags: [Tag!]
  primaryTag: Tag
  roleCount: Int!
  """
  The user's direct groups in the request's scope, not those a role brings, sorted by name.
  `page` and `limit` page them as in the groups list (by default the lists' page size). Requires
  `Group:Query`, the groups list's own permission; without it the field is an authorization error.
  """
  groups(page: Int, limit: Int): [Group!]
  """
  The user's direct permissions in the request's scope, not those a group or role brings, sorted
  by name. `page` and `limit` page them as in the permissions list. Requires `Permission:Query`,
  the permissions list's own permission; without it the field is an authorization error.
  """
  permissions(page: Int, limit: Int): [Permission!]
  "The user's direct groups in the request's scope, not those a role brings."
  groupCount: Int!
  permissionCount: Int!
  projectUserApiKeyCount: Int!
  tagCount: Int!
  authenticationMethods: [UserAuthenticationMethod!]
  accounts: [Account!]
  """
  Non-secret facts about the user's password credential in the request's project scope. `null` outside a
  project scope, when the user has no project credential there, or when the caller lacks
  `ProjectUser:ExportCredentials` (never an error). `fingerprint` is the lowercase hex SHA-256 of the
  stored hash string: a change detector, not a secret. The password and the hash are never returned here.
  """
  passwordCredential: ProjectUserPasswordCredential
  """
  Non-secret facts about the user's live (not revoked, not deleted) project-user API keys in the
  request's project scope, oldest first. `null` outside a project scope or when the caller lacks
  `ProjectUser:ExportCredentials` (never an error); `[]` for a member with no key. The secret, the
  hash and the encrypted copy are never returned here.
  """
  apiKeyCredentials: [ProjectUserApiKeyCredential!]
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date
}

enum CdmModeStrategy {
  merge
  replace
}

enum CdmOnConflict {
  fail
  skip
  update
}

enum CdmFindBy {
  key
  id
  email
  name
  slug
}

enum CdmIfMissing {
  fail
  skip
  createNew
}

"""
Password hash algorithms a CDM import can carry. Only `bcrypt` is accepted; the
enum leaves room for further algorithms without changing the input shape.
"""
enum CdmPasswordAlgorithm {
  bcrypt
}

input CdmModeInput {
  strategy: CdmModeStrategy!
  onConflict: CdmOnConflict
  confirmDestructive: Boolean
}

input CdmKeyResolverInput {
  """
  Identifier value. For `findBy: email`, Grant normalizes this to lowercase
  and resolves it against the global email authentication method catalog.
  Imported email authentication methods start unverified until a later inbox
  proof flow, such as project OAuth email magic link, verifies them.
  """
  value: String!
  """
  `id` references an existing Grant user id. `email` resolves or creates a
  global email authentication method, passwordless on the platform; a `password`
  becomes a credential of the importing project only. Other values are treated as CDM-local external keys for project
  import/export.
  """
  findBy: CdmFindBy
  ifMissing: CdmIfMissing
  """
  Only with `findBy: key`: an existing, live Grant user this key is, reused instead of creating one and marked
  with the key for this project. Refused for a missing, deleted or already-imported-under-another-key user.
  """
  grantUserId: ID
}

"""
Project resource row for CDM import/export.
"""
input ResourceCdmInput {
  key: String!
  slug: String
  name: String!
  description: String
  actions: [String!]!
  tags: [String!]
  primaryTag: String
  metadata: JSON
}

"""
Custom permission for this project; `resource` is an opaque key in the same document.
"""
input PermissionCdmInput {
  key: String!
  resource: String!
  action: String!
  name: String!
  description: String
  condition: JSON
  groups: [String!]
  tags: [String!]
  primaryTag: String
  metadata: JSON
}

input TagCdmInput {
  key: String!
  name: String!
  color: String!
  metadata: JSON
}

input GroupCdmInput {
  key: String!
  name: String!
  description: String
  permissions: [String!]
  tags: [String!]
  primaryTag: String
  """
  Denormalized search tokens for list views (email, legacy ids, etc.).
  Also persisted under metadata.cdmSource.searchable on import.
  """
  searchable: JSON
  metadata: JSON
}

input RoleCdmInput {
  key: String!
  name: String!
  description: String
  """
  Group keys from the `groups` section. When set, permissions are linked via
  Role → Group → Permission. Omit to use direct `permissions` on the role.
  """
  groups: [String!]
  """
  Permission document keys or catalog refs (`resourceSlug:action`). Used for
  direct Role → Permission when `groups` is empty.
  """
  permissions: [String!]
  tags: [String!]
  primaryTag: String
  searchable: JSON
  metadata: JSON
}

input UserApiKeyCdmInput {
  key: String
  clientId: String
  clientSecret: String
  name: String
  description: String
  expiresAt: Date
  metadata: JSON
}

"""
A password hash the importer already holds, to be stored as the importing project's
password credential (ADR 0011). Never the plaintext password.
"""
input CdmPasswordInput {
  algorithm: CdmPasswordAlgorithm!
  """
  A bcrypt hash in the modular-crypt form `$2a$`, `$2b$` or `$2y$`, a two-digit
  cost and 53 salt-and-hash characters (60 in all), such as the output of Go's
  `bcrypt.GenerateFromPassword`. The cost must be within the range the deployment
  accepts (4 to 15). It is written only to the credential store: it is not kept in
  metadata, searchable tokens, audit values, events or the stored job payload once
  the job finishes, and an invalid hash is refused without being echoed.
  """
  hash: String!
}

input UserCdmInput {
  key: CdmKeyResolverInput!
  name: String!
  """
  Role template keys from the `roles` section.
  """
  roles: [String!]
  """
  Direct group assignment. Each key must appear in the document `groups` section.
  """
  groups: [String!]
  """
  Direct user → permission grants (document keys or catalog `resourceSlug:action` refs).
  """
  permissions: [String!]
  tags: [String!]
  primaryTag: String
  apiKeys: [UserApiKeyCdmInput!]
  """
  Existing password credential to import for this user as a credential of the importing
  project only. Only valid with `key.findBy: email`, because the person is resolved by
  address; any other resolver is a validation error.

  The person must be a member of the project after the import: assigned in the same
  document (`roles`, `groups` or `permissions`) or already a member. A password for anyone
  else is a validation error raised when the import is applied, which rolls the import back
  and names the position in `users`.

  Ownership is forward-only. An imported credential is marked as imported and stays owned
  by the importing system until the person resets or changes it: a later import of this
  project with a different hash replaces it, an identical one changes nothing. Once it is
  set, changed or reset in Grant, Grant owns it and imports never touch it again. Verified
  and GitHub or Google linked identities are not excluded: the credential opens this
  project's apps only. An absent `password` never removes a stored credential. See
  `SyncProjectResult` for the counters.
  """
  password: CdmPasswordInput
  """
  Denormalized search tokens for project-scoped user list views.
  """
  searchable: JSON
  metadata: JSON
}

"""
Where the CDM document of a by-reference import is: an upload made through
`requestProjectSyncUploadUrl`. See `SyncProjectInput.source`.
"""
input SyncProjectSourceInput {
  """
  The `uploadId` returned by `requestProjectSyncUploadUrl`. The server derives the
  storage key from the project and this id; the client never supplies a path.
  """
  uploadId: ID!
  """
  How many entities (roles, users, resources, permissions, groups and tags) the
  uploaded document holds. A hint, recorded for the job list and never trusted: the
  worker counts the document itself.
  """
  entityCount: Int
}

"""
Versioned canonical project document (CDM) for export/import: roles, users,
resources, permissions, groups, and tags scoped to one project.

Two shapes. **Inline**: `version`, `roles` and `users` are required and the document is
the input. **By reference**: `source` is set, `mode` still says how to apply it, and
`version` is optional and the entity arrays (`roles`, `users`, `resources`,
`permissions`, `groups`, `tags`) must be absent: the document is the file uploaded
through `requestProjectSyncUploadUrl`, and the worker validates it, so a schema error or
an over-limit entity count surfaces as a `FAILED` job, not as an error on the mutation.
"""
input SyncProjectInput {
  "Required inline; optional with `source`, where the uploaded document carries it."
  version: Int
  id: String
  mode: CdmModeInput!
  "Required inline; must be absent with `source`."
  roles: [RoleCdmInput!]
  "Required inline; must be absent with `source`."
  users: [UserCdmInput!]
  resources: [ResourceCdmInput!]
  permissions: [PermissionCdmInput!]
  groups: [GroupCdmInput!]
  tags: [TagCdmInput!]
  """
  Import the document uploaded through `requestProjectSyncUploadUrl` instead of sending
  it inline. The entity arrays must then be absent, and `mode` (and `version`, if
  given) must match the uploaded document.
  """
  source: SyncProjectSourceInput
}

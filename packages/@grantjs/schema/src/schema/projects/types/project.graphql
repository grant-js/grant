type Project implements Auditable {
  id: ID!
  name: String!
  slug: String!
  description: String
  pictureUrl: String
  """
  Brand hex (`#RRGGBB`). Null uses Grant's default OAuth theme.
  """
  primaryColor: String
  """
  Whether the OAuth help panel is shown. Null uses Grant's default (shown).
  """
  showHelpPanel: Boolean
  """
  Whether this project keeps an exportable, encrypted copy of a project user's API-key secret at
  create and rotate. Off by default; set with `setProjectExportableApiKeySecrets`. A plain
  configuration flag: it says nothing about any key, and nothing is back-filled for keys that
  already exist.
  """
  exportableApiKeySecrets: Boolean!
  roles: [Role!]
  groups: [Group!]
  permissions: [Permission!]
  users: [User!]
  resources: [Resource!]
  tags: [Tag!]
  organizationTags: [Tag!]
  accountTags: [Tag!]
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date
}

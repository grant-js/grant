"""
Counters and warnings from a completed CDM import.
"""
type SyncProjectResult {
  projectId: ID!
  importId: String
  rolesCreated: Int!
  groupsCreated: Int!
  roleGroupsLinked: Int!
  groupPermissionsLinked: Int!
  projectRolesLinked: Int!
  projectGroupsLinked: Int!
  projectPermissionsLinked: Int!
  projectResourcesLinked: Int!
  projectUsersEnsured: Int!
  usersCreated: Int!
  userRolesAssigned: Int!
  projectUserApiKeysCreated: Int!
  """
  CDM-managed project-user API keys whose `externalKey` and secret fingerprint already
  matched on replace. Creates only increment `projectUserApiKeysCreated`.
  """
  projectUserApiKeysUnchanged: Int!
  """
  Existing CDM-managed project-user API keys whose secret changed (or had no fingerprint
  yet). The stored bcrypt hash is replaced; `api_keys.id` and `clientId` stay.
  """
  projectUserApiKeysRotated: Int!
  """
  CDM-managed project-user API keys present before replace and missing from the document
  (or lacking an importer `externalKey`).
  """
  projectUserApiKeysDeleted: Int!
  """
  Users whose `password` hash was stored as the importing project's credential for the
  first time.
  """
  passwordsImported: Int!
  """
  Users whose project credential was replaced because an earlier import of this project had
  stored a different hash.
  """
  passwordsUpdated: Int!
  """
  Users whose project credential, stored by an earlier import of this project, already
  equalled the hash in the document.
  """
  passwordsUnchanged: Int!
  """
  Users whose project credential was not written because the person owns it: it was set or
  reset in Grant, not imported.
  """
  passwordsSkippedExisting: Int!
  """
  Document users not created because the person deleted this imported identity; their
  membership, credential and API keys were not written either.
  """
  usersSkippedTombstoned: Int!
  resourcesCreated: Int!
  permissionsCreated: Int!
  tagsCreated: Int!
  projectTagsLinked: Int!
  roleTagsLinked: Int!
  groupTagsLinked: Int!
  userTagsLinked: Int!
  warnings: [String!]!
}

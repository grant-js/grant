input UpdateProjectAppInput {
  scope: Scope!
  """
  Display name for the app.
  """
  name: String
  """
  Brand hex (`#RRGGBB`). Null inherits the project color.
  """
  primaryColor: String
  """
  Whether the OAuth help panel is shown. Null inherits the project setting.
  """
  showHelpPanel: Boolean
  """
  Forced OAuth appearance (`light`, `dark`, `system`). Null keeps the visitor's Grant theme.
  """
  themeMode: String
  """
  Allowed redirect URIs for OAuth callback. If provided, at least one required.
  """
  redirectUris: [String!]
  """
  Optional OAuth scopes the app may request.
  """
  scopes: [String!]
  """
  Auth providers enabled for this app: `email` (magic link), `github`, `google` and `password` (email and password, checked against the project's own credential). Empty/null = every provider except `password`, which is opt-in and is on only when named here.
  """
  enabledProviders: [String!]
  """
  Allow new users to sign up when authenticating via this app.
  """
  allowSignUp: Boolean
  """
  Role to assign to users who sign up via this app. Required when allowSignUp is true; must be a role in the project.
  """
  signUpRoleId: ID
  tagIds: [ID!]
  primaryTagId: ID
}

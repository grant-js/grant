type ProjectApp implements Auditable {
  id: ID!
  projectId: ID!
  clientId: String!
  name: String
  pictureUrl: String
  """
  Brand hex (`#RRGGBB`). Null inherits the project color.
  """
  primaryColor: String
  """
  Whether the OAuth help panel is shown. Null inherits the project setting.
  """
  showHelpPanel: Boolean
  """
  Forced OAuth appearance (`light`, `dark`, `system`). Null keeps the visitor's Grant theme.
  """
  themeMode: String
  redirectUris: [String!]!
  scopes: [String!]
  """
  Auth providers enabled for this app (e.g. github, email). Empty/null = all configured providers.
  """
  enabledProviders: [String!]
  """
  Whether new users can sign up when authenticating via this app. Default true.
  """
  allowSignUp: Boolean
  """
  Role assigned to users who sign up via this app. Required when allowSignUp is true.
  """
  signUpRoleId: ID
  """
  Resolved role for signUpRoleId (for display).
  """
  signUpRole: Role
  project: Project
  tags: [Tag!]
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date
}

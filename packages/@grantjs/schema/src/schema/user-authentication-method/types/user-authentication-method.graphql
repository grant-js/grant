type UserAuthenticationMethod implements Auditable {
  id: ID!
  userId: ID!
  user: User
  provider: UserAuthenticationMethodProvider!
  providerId: String!
  providerData: JSON!
  isVerified: Boolean!
  isPrimary: Boolean!
  """
  True when this Email method has a password. Always false for social providers.
  """
  hasPassword: Boolean!
  lastUsedAt: Date
  createdAt: Date!
  updatedAt: Date!
  deletedAt: Date
}

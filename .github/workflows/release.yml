# Versions and publishes npm packages when a "Version packages" PR is merged to main.
# On push to main: prepare → release (changesets) → docker → optional git tag + GH Release.
#   - Feature merge: build/push :demo, :sha-<commit> (deploy pulls :demo).
#   - Version PR merge: rebuild all images with bumped package.json, push
#     :<semver>, :latest, :demo, :sha, then create v* git tag and platform GitHub Release.
# Deploy is handled by deploy.yml when the Release workflow built new images.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip path-filter checks and run all jobs'
        type: boolean
        default: false
      rebuild_release_images:
        description: 'Rebuild all images with :semver, :latest, :demo from apps/api/package.json (no npm publish)'
        type: boolean
        default: false

concurrency:
  group: grant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      release: ${{ steps.filter.outputs.release }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      example: ${{ steps.filter.outputs.example }}
      shared: ${{ steps.filter.outputs.shared }}
      workflow_release: ${{ steps.filter.outputs.workflow_release }}
      docker_matrix: ${{ steps.matrix.outputs.docker_matrix }}
      docker_matrix_release: ${{ steps.matrix.outputs.docker_matrix_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.github/actions/**'
              - '.eslintrc*'
              - 'vitest.config.*'
              - '.github/workflows/release.yml'
              - 'charts/**'
            release:
              - '.changeset/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            api: 'apps/api/**'
            web: 'apps/web/**'
            docs: 'docs/**'
            example: 'packages/@grantjs/client/examples/nextjs/**'
            shared: 'packages/**'
            workflow_release:
              - '.github/workflows/release.yml'

      - name: Build docker matrix (from changed paths)
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          ALL_IMAGES=(
            '{"image":"grant-api","file":"apps/api/Dockerfile"}'
            '{"image":"grant-web","file":"apps/web/Dockerfile"}'
            '{"image":"grant-docs","file":"docs/Dockerfile"}'
            '{"image":"example-nextjs","file":"packages/@grantjs/client/examples/nextjs/Dockerfile"}'
          )

          release_json="[$(IFS=,; echo "${ALL_IMAGES[*]}")]"
          echo "docker_matrix_release=$release_json" >> "$GITHUB_OUTPUT"

          # Always initialize, so fromJSON(...) never fails if nothing matches.
          echo 'docker_matrix=[]' >> "$GITHUB_OUTPUT"

          items=()
          force="${{ inputs.force }}"
          workflow_release="${{ steps.filter.outputs.workflow_release }}"

          # Editing release.yml (e.g. tags) must republish every image so GHCR stays consistent.
          if [[ "$force" == "true" || "$workflow_release" == "true" ]]; then
            items+=( "${ALL_IMAGES[@]}" )
          else
            if [[ "${{ steps.filter.outputs.api }}" == "true" || "${{ steps.filter.outputs.shared }}" == "true" ]]; then
              items+=( '{"image":"grant-api","file":"apps/api/Dockerfile"}' )
            fi

            if [[ "${{ steps.filter.outputs.web }}" == "true" || "${{ steps.filter.outputs.shared }}" == "true" ]]; then
              items+=( '{"image":"grant-web","file":"apps/web/Dockerfile"}' )
            fi

            if [[ "${{ steps.filter.outputs.docs }}" == "true" || "${{ steps.filter.outputs.shared }}" == "true" ]]; then
              items+=( '{"image":"grant-docs","file":"docs/Dockerfile"}' )
            fi

            if [[ "${{ steps.filter.outputs.example }}" == "true" || "${{ steps.filter.outputs.shared }}" == "true" ]]; then
              items+=( '{"image":"example-nextjs","file":"packages/@grantjs/client/examples/nextjs/Dockerfile"}' )
            fi
          fi

          json="[$(IFS=,; echo "${items[*]}")]"
          echo "docker_matrix=$json" >> "$GITHUB_OUTPUT"

  prepare:
    name: Build, test, upload artifact
    runs-on: self-hosted
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true'
      || needs.changes.outputs.release == 'true'
      || inputs.force == true
      || inputs.rebuild_release_images == true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node project
        uses: ./.github/actions/setup-node-project
        with:
          node-version: '24'
          pnpm-version: '8.15.0'

      - name: Build
        run: pnpm run build

      - name: Check tag palette distance
        run: pnpm --filter @grantjs/constants run check:palette

      - name: Test
        run: pnpm test

      - name: Create build artifact
        run: |
          include=()
          for p in packages/*/dist apps/web/.next apps/api/dist; do
            [ -e "$p" ] && include+=( "$p" )
          done
          if [ ${#include[@]} -eq 0 ]; then
            echo "No build outputs found" && exit 1
          fi
          tar --zstd --owner=0 --group=0 -cf build.tar.zst -C . "${include[@]}"

      - name: Upload build outputs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-outputs-${{ github.run_id }}
          path: build.tar.zst

  release:
    name: Version and publish (@grantjs/client, server, cli)
    runs-on: self-hosted
    needs: prepare
    if: inputs.rebuild_release_images != true
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download build outputs
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-outputs-${{ github.run_id }}
          path: build-artifacts

      - name: Restore build outputs
        run: |
          tar --zstd -xf build-artifacts/build.tar.zst -C .
          rm -rf build-artifacts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: '8.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install (prefer offline)
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
          # Platform GitHub Releases are created as v* by release-git-tag.
          # Per-package releases are noisy (empty bodies for fixed-group bumps).
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Build and push images
    runs-on: self-hosted
    needs: [prepare, changes, release]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (
        inputs.rebuild_release_images == true ||
        needs.release.outputs.published == 'true' ||
        needs.changes.outputs.docker_matrix != '[]'
      )
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.rebuild_release_images == true || needs.release.outputs.published == 'true') && needs.changes.outputs.docker_matrix_release || needs.changes.outputs.docker_matrix) }}
    steps:
      - name: Debug docker matrix
        run: |
          echo "published=${{ needs.release.outputs.published }}"
          echo "rebuild_release_images=${{ inputs.rebuild_release_images }}"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          PUBLISHED: ${{ needs.release.outputs.published }}
          REBUILD_RELEASE: ${{ inputs.rebuild_release_images }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          BASE="ghcr.io/${{ github.repository }}/${IMAGE}"
          if [[ "$PUBLISHED" == "true" || "$REBUILD_RELEASE" == "true" ]]; then
            VERSION="$(node -p "require('./apps/api/package.json').version")"
            {
              echo "tags<<EOF"
              echo "${BASE}:${VERSION}"
              echo "${BASE}:latest"
              echo "${BASE}:demo"
              echo "${BASE}:sha-${{ github.sha }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${BASE}:demo"
              echo "${BASE}:sha-${{ github.sha }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.image }}
        uses: ./.github/actions/docker-build-push
        with:
          context: .
          file: ${{ matrix.file }}
          # Stable across commits so BuildKit GHA cache reuses layers when lockfile/Dockerfiles unchanged.
          cache_scope: ${{ matrix.image }}-${{ hashFiles('pnpm-lock.yaml', 'apps/api/Dockerfile', 'apps/web/Dockerfile', 'docs/Dockerfile', 'packages/@grantjs/client/examples/nextjs/Dockerfile') }}
          image: ${{ matrix.image }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true

  release-git-tag:
    name: Create release git tag and GitHub Release
    runs-on: ubuntu-latest
    needs: [release, docker]
    if: needs.release.outputs.published == 'true' && inputs.rebuild_release_images != true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read platform version
        id: version
        run: echo "version=$(node -p "require('./apps/api/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; will still ensure GitHub Release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Create the release in this job: GITHUB_TOKEN tag pushes do not trigger
      # github-release.yml (GitHub blocks workflow recursion from the default token).
      - name: Extract release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          ./scripts/extract-release-notes.sh "$VERSION" "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true

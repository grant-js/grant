name: CI

# Story trunks (`feat/**`) are PR targets too: the Agentic SDLC stacks slice PRs into a
# trunk before the trunk opens a single PR to main. Without `feat/**` here, every slice
# merges with no CI and the trunk->main PR is the first run — the worst place to find a break.
on:
  pull_request:
    branches: [main, 'feat/**']

# All Dependabot PRs share one concurrency group so they don't flood the runner (8 PRs = 1 job at a time, not 8). Human PRs keep per-ref isolation.
concurrency:
  group: ${{ github.actor == 'dependabot[bot]' && format('grant-{0}-dependabot', github.workflow) || format('grant-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    # Self-hosted, matching build-test below. This gate is checkout + paths-filter, but
    # every downstream job `needs` it — on a hosted runner it becomes a single point of
    # failure that strands the whole pipeline while the self-hosted runner sits idle.
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'charts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.github/actions/**'
              # Workflow edits change how everything else is verified, so they must
              # be verified themselves — without this, a CI change merges untested.
              - '.github/workflows/**'
              # scripts/ generates files the gates below check (the root CHANGELOG
              # is written by extract-release-notes.sh and read by format:check),
              # so a generator change must be verified like any other code change.
              - 'scripts/**'
              - 'eslint.config.*'
              - '.eslintrc*'
              - 'knip.json'
              - 'vitest.config.*'

  build-test:
    name: Lint, build, test
    runs-on: self-hosted
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      pull-requests: write # gitleaks-action default PR comments
    # Optional: skip CI for Dependabot PRs to free the runner — uncomment next line:
    # if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Helm lint (grant-platform chart)
        run: helm lint charts/grant-platform

      - name: Setup Node project
        uses: ./.github/actions/setup-node-project
        with:
          node-version: '24'
          pnpm-version: '8.15.0'

      # Org-owned repos need GITLEAKS_LICENSE (free key via gitleaks.io). See:
      # https://github.com/gitleaks/gitleaks-action#-announcement
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Build
        run: pnpm run build

      # The pre-push hook runs format:check, but only for people pushing from a
      # terminal — anything merged through the GitHub UI bypasses it. Unformatted
      # files reached main that way, and were only noticed when a later branch
      # inherited them and could not be pushed.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # apps/api, apps/web, @grantjs/core, @grantjs/database, @grantjs/schema, the
      # 12 internal packages, and -- since pass 7 -- the published trio below.
      # Every workspace is now behind a dead-code gate.
      - name: Dead code (apps/api)
        run: pnpm run dead-code:api

      - name: Dead code (apps/web)
        run: pnpm run dead-code:web

      - name: Dead code (@grantjs/core)
        run: pnpm run dead-code:core

      - name: Dead code (@grantjs/database)
        run: pnpm run dead-code:database

      - name: Dead code (@grantjs/schema)
        run: pnpm run dead-code:schema

      # The 12 internal packages in one step rather than 12: the adapters plus
      # constants, env and i18n. Note knip's blind spot here — entry is src/index.ts,
      # so every barrel re-export counts as used and unused *exports* are not
      # measurable this way. What this does catch is unused files and dependencies.
      - name: Dead code (internal @grantjs packages)
        run: pnpm run dead-code:packages

      # The published trio. Closes the last gap in the dead-code gate: before pass 7
      # these three were the only workspaces outside it. Note knip measures something
      # narrower here than the name suggests -- with entry points inferred from each
      # package's `exports` map, a symbol re-exported from a public barrel counts as
      # used by construction, and a genuinely unused one is still not deletable
      # without a major. What this catches is unused files, unused dependencies, and
      # exports that never reach a public entry point at all.
      - name: Dead code (published @grantjs packages)
        run: pnpm run dead-code:published

      # @grantjs/schema's generated types are committed. Regenerate and fail on any
      # diff, so an edited .graphql file can never ship with a stale type. Scoped to
      # src/generated because codegen's afterAllFileWrite hook reformats the whole
      # package, which is format:check's job, not this gate's.
      - name: Codegen drift (@grantjs/schema)
        run: pnpm run codegen:check

      # The script that enforces exactly which packages may be published. It existed
      # as `release:check` from the start and ran in no workflow, so the guardrail on
      # the npm contract surface was a manual step nobody was required to take.
      - name: Publishable packages (@grantjs/schema, client, server, cli)
        run: pnpm run release:check

      # format:check gates the committed root CHANGELOG.md, but that file is written
      # by `pnpm run version` — so a generator emitting markdown Prettier rejects
      # could only surface on an open version PR. This runs the generators over a
      # fixture tree instead.
      - name: Release-notes generation
        run: pnpm run release-notes:check

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm test

      - name: Audit (quick)
        run: pnpm run audit:quick
        continue-on-error: true

      - name: E2E tests
        run: pnpm test:e2e

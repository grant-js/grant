name: CodeQL

# Advanced setup. It replaces GitHub's CodeQL "default setup", which cannot take
# `paths-ignore`. GitHub rejects advanced-setup uploads while default setup is
# enabled, so a repo admin must switch Code scanning from Default to Advanced
# (Settings > Code security > Code scanning > CodeQL analysis > Switch to advanced).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

# Only superseded pull-request runs are cancelled; a push to main and the weekly
# scan share a ref and must not abort each other after one language's upload.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Same languages as default setup: its checks are named
        # "Analyze (actions)" and "Analyze (javascript-typescript)".
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: '/language:${{ matrix.language }}'

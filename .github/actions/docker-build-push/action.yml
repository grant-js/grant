# Composite action: Buildx + build-push with provenance: false.
#
# No `type=gha` layer cache. These jobs run on the self-hosted `demo` host, whose
# uplink to the GitHub cache service is slow: exporting the cache (mode=max) took
# 86-225 s per image, ~553 s of the 866 s spent building the four images in
# release run 42505916953. In that run and in 42297895851 the install and build
# layers were never restored from it; only a few base-image layers were.
# Reintroduce a cache only together with a Dockerfile layout that can hit it.
name: Docker build and push
description: Setup Buildx and build/push an image
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.3.0

    - name: Build and push
      uses: docker/build-push-action@v6.6.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        provenance: false
        # Both default to '' so existing callers are byte-identical: an empty
        # target builds the Dockerfile's last stage, and empty platforms builds
        # for the runner's own architecture.
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platforms }}

inputs:
  context:
    description: Build context path
    required: false
    default: .
  file:
    description: Path to Dockerfile
    required: true
  image:
    description: Image name (for reference; tags are passed explicitly)
    required: false
  tags:
    description: Multiline list of image tags
    required: true
  push:
    description: Whether to push to registry
    required: true
    default: true
  target:
    description: Dockerfile stage to build. Empty builds the last stage.
    required: false
    default: ''
  platforms:
    description: Target platforms (e.g. linux/arm64). Empty builds for the runner's architecture.
    required: false
    default: ''

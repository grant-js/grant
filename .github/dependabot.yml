# Dependabot: keep dependencies and GitHub Actions up to date
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # npm (root + all workspaces via pnpm-lock.yaml)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Madrid'
    # One grouped PR for every bump except TypeScript (ADR 0006) and graphql
    # 17 (Apollo Server 5). The weekly consolidator folds this with Actions,
    # migrates majors, and opens one human-reviewed PR to main. See
    # docs/contributing/weekly-deps.md.
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      all:
        patterns:
          - '*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
    ignore:
      # `typescript` is an alias to @typescript/typescript6 (the 6.x JS API).
      # Dependabot must not replace it with typescript@7. Bump the wrapper and
      # `@typescript/native` (real typescript@7) by hand until ADR 0006's
      # removal trigger. See decisions/0006-typescript-7-dual-install.md.
      - dependency-name: 'typescript'
      - dependency-name: '@typescript/typescript6'
      # Apollo Server 5 peers graphql@^16.11.0. graphql@17 throws
      # `Cannot read properties of null (reading 'constructor')` on
      # `startProjectSync` e2e. Keep 16.x until AS peers 17.
      - dependency-name: 'graphql'

  # GitHub Actions (workflows) — one PR for all action updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Europe/Madrid'
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      all:
        patterns:
          - '*'
